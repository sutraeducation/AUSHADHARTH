[package]
name = "aushadharth-store-service"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.99"
axum = "0.8.4"
directories = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "time"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.21.0"
tower = { version = "0.5.2", features = ["util"] }
